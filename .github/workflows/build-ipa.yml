name: Build Jala IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode and SDKs
        continue-on-error: true
        run: |
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
          echo "::notice::SDKs: $(xcodebuild -showsdks | grep -o 'iphoneos[0-9.]*' | tr '\n' ' ')"
          echo "::notice::$(xcodebuild -list -project Jala.xcodeproj 2>&1 | tr '\n' ' ' | tr -s ' ')"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Jala.xcodeproj -scheme Jala -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee xcodebuild.log || {
              # Surface the real errors as annotations on the run page.
              grep -E "error:|is not installed|does not contain|Unable to" xcodebuild.log | head -15 | sed 's/^/::error::/'
              exit 1
            }

      - name: Package IPA for TrollStore
        run: |
          APP=build/Build/Products/Release-iphoneos/Jala.app
          ldid -S "$APP/Jala"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Jala.ipa Payload
          ls -lh Jala.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Jala-ipa
          path: Jala.ipa

      # A release gives a direct .ipa link that opens on the iPhone ("Open in TrollStore").
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Jala.ipa \
            --title "جلا — build ${{ github.run_number }}" \
            --notes "افتح Jala.ipa من الجوال واختر Open in TrollStore."
